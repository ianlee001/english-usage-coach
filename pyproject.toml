[project]
name = "english-ai-coach"
version = "0.1.0"
description = "Local English usage coach with Qwen, MinerU, Tavily, Chroma and SQLite"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit>=1.45,<2",
    "python-dotenv>=1,<2",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langchain-chroma>=1,<2",
    "chromadb>=1,<2",
    "langchain-tavily>=0.2,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-mineru>=0.1.3,<0.2",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
